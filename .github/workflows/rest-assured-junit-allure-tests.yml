name: Build & Deploy Allure Report

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # ✅ CRITICAL: Give token WRITE PERMISSION!
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn clean test

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Generate Report
        run: allure generate target/allure-results -o allure-report --clean

      # ✅ Deploy with token — NOW HAS WRITE PERMISSION!
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          enable_jekyll: false  # Auto-adds .nojekyll → sidebar works!
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"