name: Maven Tests + Allure Report

# Trigger the workflow on:
# - Push commits to these branches
# - Pull requests targeting these branches
# - Manual trigger from the Actions tab
on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]
  workflow_dispatch:

# Permissions required to generate and deploy the Allure report
permissions:
  contents: write      # Needed to push the gh-pages branch
  pages: write         # Needed for GitHub Pages deployment API
  id-token: write      # Needed for secure Pages authentication

jobs:
  test:
    name: Run Tests & Generate Report
    runs-on: ubuntu-latest   # Use Ubuntu latest runner image

    steps:
      # Step 1: Check out your repository code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install and configure Java 21 (matches your project choice)
      # 'temurin' = Adoptium Temurin (standard open-source JDK)
      # 'cache: maven' = saves downloaded dependencies to speed up future runs
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Step 3: Explicitly cache Maven repository files
      # Reuses dependencies from previous runs instead of re-downloading
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: Run your tests using Maven
      # This generates the raw Allure result files in target/allure-results
      - name: Run tests
        run: mvn clean test

      # Step 5: Upload raw Allure results as a build artifact
      # 'if: always()' = saves results even if tests fail
      # You can download this from the Actions page if needed
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      # Step 6: Download and install Allure Commandline
      # Version 2.29.1 matches exactly the version in your pom.xml
      # Extracts the archive and adds the 'allure' binary to PATH
      - name: Install Allure Commandline
        run: |
          ALLURE_VERSION=2.29.1
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH

      # Step 7: Generate the HTML Allure Report from results
      # --clean = removes old report files before generating new one
      - name: Generate Allure Report
        run: allure generate target/allure-results -o allure-report --clean

      # Step 8: Deploy the generated HTML report to GitHub Pages
      # Pushes the 'allure-report' folder to 'gh-pages' branch
      # Report becomes available at: https://ballachakri.github.io/rest-assured-junit-allure/
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()   # Deploys report even if some tests failed
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}   # Auto-provided by GitHub
          publish_dir: allure-report                    # Folder to publish